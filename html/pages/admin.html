  <!-- ADMIN PANEL — manually granted (admins/{phone} doc), client-side gated only -->
  <div class="screen hidden" id="screen-admin">
    <div class="backbtn" onclick="goTo('mine')">&larr; กลับ</div>
    <p style="font-size: 15px; font-weight: 700; margin: 2px 0 4px">
      🛡️ แผงควบคุมแอดมิน
    </p>
    <p style="font-size: 12px; color: var(--ink-soft); margin: 0 0 16px">
      จัดการรายงาน แบนผู้ใช้ และลบประกาศที่ไม่เหมาะสม
    </p>

    <div
      style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      "
    >
      <p class="rule-section-title" style="margin: 0">รายงานที่รอดำเนินการ</p>
      <span
        style="
          font-size: 11.5px;
          color: var(--gold);
          text-decoration: underline;
          cursor: pointer;
        "
        onclick="renderAdminPanel()"
        >รีเฟรช</span
      >
    </div>
    <div id="adminReportsList">
      <p style="color: var(--ink-soft); font-size: 12.5px">กำลังโหลด...</p>
    </div>

    <p class="rule-section-title" style="margin-top: 22px">
      แบนผู้ใช้ด้วยเบอร์โทร
    </p>
    <div class="field">
      <input
        type="tel"
        id="adminBanPhoneInput"
        placeholder="เบอร์โทรที่จะแบน เช่น 0812345678"
        maxlength="10"
      />
      <input
        type="text"
        id="adminBanReasonInput"
        placeholder="เหตุผล (ไม่บังคับ)"
        style="margin-top: 8px"
      />
    </div>
    <button class="btn btn-primary" onclick="adminBanByPhone()">
      แบนเบอร์นี้
    </button>

    <p class="rule-section-title" style="margin-top: 22px">
      บัญชีที่ถูกแบนอยู่
    </p>
    <div id="adminBannedList">
      <p style="color: var(--ink-soft); font-size: 12.5px">กำลังโหลด...</p>
    </div>
  </div>
