  <!-- FEEDBACK -->
  <div class="screen hidden" id="screen-feedback">
    <div class="backbtn" onclick="goTo('mine')">&larr; กลับ</div>
    <p style="font-size: 15px; font-weight: 700; margin: 2px 0 4px">
      ช่วยให้ฟีดแบ็กหน่อย
    </p>
    <p style="font-size: 12px; color: var(--ink-soft); margin: 0 0 20px">
      ไม่มีคำตอบถูกผิด ตอบตามความรู้สึกจริงเลย ใช้เวลาไม่ถึง 2 นาที
    </p>

    <div class="field">
      <label
        >คุณจะแนะนำแอปนี้ให้เพื่อนไหม? (0 = ไม่เลย, 10 = แนะนำแน่นอน)</label
      >
      <div
        class="select-row"
        id="npsGrid"
        style="grid-template-columns: repeat(6, 1fr); gap: 6px"
      ></div>
    </div>

    <div class="field">
      <label
        >เชื่อมั่นแค่ไหนกับระบบ "นัดจ่ายเงิน/ส่งของกันเองผ่านแชท"
        (แอปนี้ยังไม่มีระบบพักเงินกลาง)?</label
      >
      <div
        class="select-row"
        id="trustGrid"
        style="grid-template-columns: repeat(5, 1fr); gap: 6px"
      ></div>
    </div>

    <div class="field">
      <label>ถ้าขายของได้ ค่าคอมมิชชั่นสูงสุดกี่ % ที่ยังยอมจ่าย?</label>
      <input type="number" id="fbFee" placeholder="เช่น 7" min="0" max="100" />
    </div>

    <div class="field">
      <label>อยากบอกอะไรเพิ่มเติมไหม (ชอบ/ไม่ชอบ/งงตรงไหน)</label>
      <textarea id="fbComment" placeholder="พิมพ์ตรงนี้..."></textarea>
    </div>

    <p
      id="fbError"
      style="
        color: var(--red);
        font-size: 12px;
        display: none;
        margin: -6px 0 14px;
      "
    ></p>
    <button class="btn btn-primary" onclick="submitFeedback()">
      ส่งฟีดแบ็ก
    </button>
  </div>
